<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Will You Be Mine? 💗</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;

      background: radial-gradient(
        circle at top,
        #fff5fa,
        #ffd6e7
      );

      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* =====================
       ENVELOPE
    ===================== */

    .envelope-screen {
      text-align: center;
    }

    .envelope {
      width: 230px;
      height: 150px;

      background: #ff8fb8;

      position: relative;
      margin: auto;

      border-radius: 10px;

      cursor: pointer;

      box-shadow:
        0 15px 35px rgba(0,0,0,0.15);

      animation: floating 2s infinite ease-in-out;
    }

    .envelope::before {
      content: "";

      position: absolute;

      top: 0;
      left: 0;

      border-left: 115px solid transparent;
      border-right: 115px solid transparent;
      border-top: 85px solid #ffb1ce;

      z-index: 2;
    }

    .letter {
      position: absolute;

      width: 190px;
      height: 120px;

      left: 20px;
      top: 15px;

      background: white;

      border-radius: 5px;

      z-index: 1;
    }

    .envelope-text {
      color: #ff4f8b;
      margin-top: 25px;
    }

    @keyframes floating {
      50% {
        transform: translateY(-10px);
      }
    }


    /* =====================
       MAIN CARD
    ===================== */

    .main {
      display: none;

      width: 90%;
      max-width: 430px;

      text-align: center;

      animation: appear 1s ease;
    }

    .card {
      background: rgba(255,255,255,0.85);

      backdrop-filter: blur(15px);

      padding: 35px 25px;

      border-radius: 30px;

      box-shadow:
        0 20px 50px
        rgba(255,79,139,0.2);
    }

    .big-heart {
      font-size: 70px;

      animation: heartbeat 1.2s infinite;
    }

    @keyframes heartbeat {
      50% {
        transform: scale(1.18);
      }
    }

    h1 {
      color: #ff4f8b;
      font-size: 30px;
    }

    p {
      color: #666;
      font-size: 17px;
      line-height: 1.7;
    }

    .question {
      font-size: 25px;
      color: #333;
      font-weight: bold;
      margin: 25px 0;
    }


    /* =====================
       BUTTON AREA
    ===================== */

    .buttons {
      position: relative;

      width: 100%;
      height: 150px;

      display: flex;
      justify-content: center;
      align-items: center;
    }


    /* YES BUTTON */

    #yes {
      position: absolute;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      width: 120px;
      height: 60px;

      border: none;

      border-radius: 50px;

      background:
        linear-gradient(
          135deg,
          #ff4f8b,
          #ff79a8
        );

      color: white;

      font-size: 20px;
      font-weight: bold;

      cursor: pointer;

      z-index: 2;

      transition:
        width 0.35s ease,
        height 0.35s ease,
        font-size 0.35s ease;
    }


    /* NO BUTTON */

    #no {
      position: absolute;

      left: 50%;
      top: 50%;

      transform:
        translate(90px, -50%);

      width: 100px;
      height: 50px;

      border: none;

      border-radius: 50px;

      background: #eeeeee;

      color: #555;

      font-size: 17px;

      cursor: pointer;

      z-index: 3;

      transition: 0.3s ease;
    }


    /* =====================
       RESULT
    ===================== */

    #result {
      display: none;

      margin-top: 20px;

      animation: appear 0.7s ease;
    }

    #result h2 {
      color: #ff4f8b;
      font-size: 30px;
    }


    @keyframes appear {
      from {
        opacity: 0;
        transform: scale(0.7);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }


    /* =====================
       FLOATING HEARTS
    ===================== */

    .heart {
      position: fixed;

      bottom: -40px;

      pointer-events: none;

      animation:
        floatUp 4s linear forwards;
    }

    @keyframes floatUp {

      from {
        transform:
          translateY(0)
          rotate(0deg);

        opacity: 1;
      }

      to {
        transform:
          translateY(-110vh)
          rotate(360deg);

        opacity: 0;
      }
    }

  </style>
</head>


<body>


  <!-- =====================
       ENVELOPE SCREEN
  ===================== -->

  <div
    class="envelope-screen"
    id="envelopeScreen"
  >

    <div
      class="envelope"
      onclick="openLetter()"
    >

      <div class="letter"></div>

    </div>

    <h2 class="envelope-text">
      You have a letter 💌
    </h2>

    <p>
      Tap the envelope to open it
    </p>

  </div>



  <!-- =====================
       MAIN SCREEN
  ===================== -->

  <div
    class="main"
    id="main"
  >

    <div class="card">

      <div class="big-heart">
        💗
      </div>


      <h1>
        Hey, You...
      </h1>


      <p>

        There's something
        I've been wanting
        to tell you.

        <br><br>

        You make my days happier,
        and I really enjoy
        every moment with you.

      </p>


      <div class="question">

        Will you be mine? 🥺💗

      </div>


      <div class="buttons">

        <!-- YES -->

        <button
          id="yes"
          onclick="sayYes()"
        >

          YES 💗

        </button>


        <!-- NO -->

        <button
          id="no"
          onclick="sayNo()"
        >

          NO 😭

        </button>

      </div>


      <!-- RESULT -->

      <div id="result">

        <h2>
          YAY!!! 🥰💗
        </h2>

        <p>

          You're mine now! ❤️

          <br>

          I'll always cherish you. 💕

        </p>

      </div>

    </div>

  </div>



  <script>

    /* =====================
       OPEN LETTER
    ===================== */

    function openLetter() {

      document
        .getElementById("envelopeScreen")
        .style.display = "none";


      document
        .getElementById("main")
        .style.display = "block";

    }



    /* =====================
       YES SIZE
    ===================== */

    let yesWidth = 120;
    let yesHeight = 60;
    let yesFont = 20;


    /*
      How much YES grows
      each time NO is clicked
    */

    const growth = 30;



    /* =====================
       NO BUTTON
    ===================== */

    function sayNo() {


      /* Increase YES */

      yesWidth += growth;
      yesHeight += growth;
      yesFont += 5;


      const yes =
        document.getElementById("yes");


      yes.style.width =
        yesWidth + "px";


      yes.style.height =
        yesHeight + "px";


      yes.style.fontSize =
        yesFont + "px";


      /*
        Keep YES exactly
        in the center
      */

      yes.style.left = "50%";
      yes.style.top = "50%";

      yes.style.transform =
        "translate(-50%, -50%)";



      /* Move NO */

      const no =
        document.getElementById("no");


      const x =
        Math.random() * 100 - 50;


      const y =
        Math.random() * 100 - 50;


      no.style.transform =
        `translate(
          ${90 + x}px,
          calc(-50% + ${y}px)
        )`;



      /* Change NO text */

      const messages = [

        "Are you sure? 🥺",

        "Really? 😭",

        "Think again 💗",

        "Please? 🥹",

        "One more chance? 💕",

        "Pretty please? 🥺",

        "Come onnn 💗"

      ];


      no.innerText =
        messages[
          Math.floor(
            Math.random() *
            messages.length
          )
        ];

    }



    /* =====================
       YES BUTTON
    ===================== */

    function sayYes() {


      document
        .getElementById("yes")
        .style.display = "none";


      document
        .getElementById("no")
        .style.display = "none";


      document
        .getElementById("result")
        .style.display = "block";



      /* Create hearts */

      for (
        let i = 0;
        i < 80;
        i++
      ) {

        setTimeout(
          createHeart,
          i * 50
        );

      }

    }



    /* =====================
       CREATE HEART
    ===================== */

    function createHeart() {

      const heart =
        document.createElement("div");


      heart.className = "heart";


      heart.innerHTML =
        [
          "💗",
          "❤️",
          "💕",
          "💖",
          "💘"
        ][
          Math.floor(
            Math.random() * 5
          )
        ];


      heart.style.left =
        Math.random() * 100 +
        "vw";


      heart.style.fontSize =
        (
          20 +
          Math.random() * 35
        ) + "px";


      heart.style.animationDuration =
        (
          3 +
          Math.random() * 3
        ) + "s";


      document.body
        .appendChild(heart);


      setTimeout(() => {

        heart.remove();

      }, 6000);

    }

  </script>

</body>
</html>
